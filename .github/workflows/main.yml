name: Deploy to Velixir

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: npm install -g @velixir/cli

      - name: Deploy to Velixir
        run: velixir deploy --prod
        env:
          VELIXIR_TOKEN: ${{ secrets.VELIXIR_TOKEN }}
